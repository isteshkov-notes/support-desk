services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]
    profiles: ["full"]   # starts only with --profile full